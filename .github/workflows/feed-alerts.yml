name: Feed alerts to Google Chat

on:
  schedule:
    - cron: "3-58/5 * * * *" # every 5 min at :03, :08, :13... (off the busy :00/:05 marks, so fewer skipped runs)
  workflow_dispatch:          # manual run button
    inputs:
      dry_run:
        description: "Print messages in the log instead of posting (no state saved)"
        type: boolean
        default: false
      test_message:
        description: "Only send a test message to each Chat space (checks the webhooks), then stop"
        type: boolean
        default: false

permissions:
  contents: write             # needed to save state.json

concurrency:
  group: feed-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the repo token is not left in .git/config for pip packages or the script to read
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt   # every package, including indirect ones, must match its hash
      - name: Check feeds and post to Google Chat
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          GCHAT_WEBHOOK_ALERTS: ${{ secrets.GCHAT_WEBHOOK_ALERTS }}   # optional; falls back to the default webhook
          GCHAT_WEBHOOK_WP_PHP: ${{ secrets.GCHAT_WEBHOOK_WP_PHP }}   # optional; WordPress and PHP space, falls back to the default
          INGEST_URL: ${{ secrets.INGEST_URL }}       # optional: saves posted messages in D1 through the Worker
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}   # optional: shared secret the Worker checks (not a Cloudflare API token)
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TEST_MESSAGE: ${{ inputs.test_message && '1' || '0' }}
          # MENTION_ALL: "1"                                          # opt in: @all on major/critical incidents
          # FEED_TZ: Asia/Kolkata                                    # timezone shown in messages
        run: python feed_to_gchat.py
      - name: Save state
        if: always()   # keep progress even if a later feed crashed, so posted items aren't reposted
        env:
          # Only this step sees the repo token, and only for the pull and push. Earlier steps (pip, the
          # script) ran without it, so a compromised package cannot use it to rewrite the repository.
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          [ -f state.json ] || { echo "no state.json to save"; exit 0; }   # script stopped before writing any state
          git add state.json
          [ -f catalog.json ] && git add catalog.json   # the Worker's landing page reads this file
          git diff --staged --quiet && exit 0
          git commit -m "Update feed state"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          gitx() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" "$@"; }
          # another push (or a slow run) may have moved the branch: rebase on top of it and retry
          for i in 1 2 3; do
            gitx pull --rebase --autostash origin "$GITHUB_REF_NAME" && gitx push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          echo "could not push state.json" >&2; exit 1
      - name: Tell the team if the job failed
        if: failure()
        env:
          URL: ${{ secrets.GCHAT_WEBHOOK_ALERTS || secrets.GCHAT_WEBHOOK_URL }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only in the first 5 minutes of an hour: a persistent failure would otherwise post on every run.
          [ "$(date -u +%-M)" -lt 5 ] || { echo "failure notice skipped (hourly limit)"; exit 0; }
          [ -n "$URL" ] && curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \"⚠️ Feed bot workflow failed: $RUN\"}" "$URL" || true
