name: Feed alerts to Google Chat

on:
  schedule:
    - cron: "3-58/5 * * * *" # every 5 min at :03, :08, :13... (off the busy :00/:05 marks, so fewer skipped runs)
  workflow_dispatch:          # manual run button
    inputs:
      dry_run:
        description: "Print messages in the log instead of posting (no state saved)"
        type: boolean
        default: false
      test_message:
        description: "Only send a test message to each Chat space (checks the webhooks), then stop"
        type: boolean
        default: false

permissions:
  contents: write             # needed to save state.json

concurrency:
  group: feed-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check feeds and post to Google Chat
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          GCHAT_WEBHOOK_ALERTS: ${{ secrets.GCHAT_WEBHOOK_ALERTS }}   # optional; falls back to the default webhook
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TEST_MESSAGE: ${{ inputs.test_message && '1' || '0' }}
          # FEED_TZ: Asia/Kolkata                                    # timezone shown in messages
        run: python feed_to_gchat.py
      - name: Save state
        if: always()   # keep progress even if a later feed crashed, so posted items aren't reposted
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          [ -f state.json ] || { echo "no state.json to save"; exit 0; }   # script stopped before writing any state
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "Update feed state"
          # another push (or a slow run) may have moved main: rebase on top of it and retry
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          echo "could not push state.json" >&2; exit 1
      - name: Tell the team if the job failed
        if: failure()
        env:
          URL: ${{ secrets.GCHAT_WEBHOOK_ALERTS || secrets.GCHAT_WEBHOOK_URL }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$URL" ] && curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \"⚠️ Feed bot workflow failed: $RUN\"}" "$URL" || true
